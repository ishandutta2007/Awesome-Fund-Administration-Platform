<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Animated Glowing Orbs -->
  <circle cx="950" cy="180" r="140" fill="#a855f7" opacity="0.25">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.35;0.2" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="820" cy="100" r="90" fill="#6366f1" opacity="0.2">
    <animate attributeName="r" values="80;100;80" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Right Visual Graphics: Cards & Chart -->
  <g transform="translate(700, 50)">
    <!-- Base Card -->
    <rect x="50" y="20" width="380" height="220" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Mini Metric Cards -->
    <g transform="translate(20, 140)">
      <rect width="160" height="70" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <text x="15" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Net Asset Value (NAV)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#34d399">$1.24B ↑</text>
    </g>

    <g transform="translate(230, 30)">
      <rect width="170" height="65" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Capital Calls &amp; Dist.</text>
      <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">Automated ⚡</text>
    </g>

    <!-- Animated Chart Line -->
    <path d="M 80 170 Q 140 130 200 150 T 320 80 T 390 100" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Data Points -->
    <circle cx="200" cy="150" r="4" fill="#6366f1"/>
    <circle cx="320" cy="80" r="4" fill="#ec4899"/>
  </g>

  <!-- Left Side Text & Branding -->
  <g transform="translate(70, 75)">
    <!-- Top Badge -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
    <text x="15" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">📊 PRIVATE CAPITAL PLATFORMS &amp; ECOSYSTEM</text>

    <!-- Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#ffffff">Awesome Fund Administration</text>
    
    <!-- Underline -->
    <rect x="0" y="90" width="530" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="17" fill="#cbd5e1">A curated directory of SaaS platforms &amp; open-source projects</text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="17" fill="#cbd5e1">for PE, VC, Real Estate, NAV Accounting &amp; LP Reporting.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">🏛️ Fund Accounting</text>

      <rect x="150" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" transform="translate(150, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">📈 LP Portals</text>

      <rect x="275" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" transform="translate(275, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">💸 Waterfall NAV</text>
      
      <rect x="420" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" transform="translate(420, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">⚡ Open Source</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 18px; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-circle { animation: pulse 6s infinite ease-in-out; transform-origin: 950px 180px; }
    .floating-card-1 { animation: float1 5s infinite ease-in-out; }
    .floating-card-2 { animation: float2 7s infinite ease-in-out; }
    .chart-line { stroke-dasharray: 8; animation: dash 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (Placed on Right side to keep Text crisp on Left) -->
  <circle class="animated-circle" cx="950" cy="180" r="140" fill="#a855f7" opacity="0.25" filter="url(#glow)"/>
  <circle class="animated-circle" cx="820" cy="100" r="90" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Right Visual Graphics: Fund Ops & Financial Chart Elements -->
  <g transform="translate(700, 50)">
    <!-- Main Decorative Card -->
    <rect class="floating-card-1" x="50" y="20" width="380" height="220" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    
    <!-- Mini Metric Cards -->
    <g class="floating-card-2" transform="translate(20, 140)">
      <rect width="150" height="70" rx="10" fill="#1e293b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
      <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#94a3b8">Net Asset Value (NAV)</text>
      <text x="15" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#34d399">$1.24B ↑</text>
    </g>

    <g class="floating-card-1" transform="translate(240, 30)">
      <rect width="160" height="65" rx="10" fill="#1e293b" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
      <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8">Capital Calls & Dist.</text>
      <text x="15" y="48" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">Automated ⚡</text>
    </g>

    <!-- Simulated Chart Line in Background Card -->
    <path class="chart-line" d="M 80 170 Q 140 130 200 150 T 320 80 T 390 100" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Data Points -->
    <circle cx="200" cy="150" r="4" fill="#6366f1"/>
    <circle cx="320" cy="80" r="4" fill="#ec4899"/>
  </g>

  <!-- Left Side Foreground Text & Branding -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <text x="15" y="19" class="badge-text">📊 PRIVATE CAPITAL PLATFORMS &amp; ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title">Awesome Fund Administration</text>
    
    <!-- Title Underline Accent -->
    <rect x="0" y="90" width="520" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">A curated directory of SaaS platforms &amp; open-source projects</text>
    <text x="0" y="155" class="subtitle">for PE, VC, Real Estate, NAV Accounting &amp; LP Reporting.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">🏛️ Fund Accounting</text>

      <rect x="125" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="137" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">📈 LP Portals</text>

      <rect x="245" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="257" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">💸 Waterfall NAV</text>
      
      <rect x="380" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="392" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">⚡ Open Source</text>
    </g>
  </g>
</svg>
